[project]
name = "vne"
version = "0.2.0"
description = "von Neumann's elephant"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "BSD 3-Clause" }
authors = [ { name = "Alan R. Lowe" } ]

dependencies = [
  "numpy",
  "pillow",
  "requests",
  "scikit-image",
  "scikit-learn",
  "scipy",
  "dscribe",
  "ase",
  "torch",
  "numba>=0.60.0",
  "tqdm",
  "torchvision",
  "fastapi",
  "ipykernel",
  "pathos",
  "copick",
  "gemmi",
  "pytorch-lightning",
  "mlflow",
  "uvicorn",
]

[project.optional-dependencies]
dev = ["dscribe", "ase", "pytest", "pre-commit"]
